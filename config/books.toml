# Which profile (from profiles.toml) and which lead singer each book gets.
#
# Set per book, never per chapter, so a whole book keeps one style and one singer.
#   profile = one of the names in profiles.toml: folk, country, jazz, lullaby, pop, hardrock, gospel, hymn
#   lead    = "female" or "male"
#
# Books use the USFM codes: GEN EXO LEV NUM DEU JOS JDG RUT 1SA 2SA 1KI 2KI 1CH 2CH EZR NEH EST
# JOB PSA PRO ECC SNG ISA JER LAM EZK DAN HOS JOL AMO OBA JON MIC NAM HAB ZEP HAG ZEC MAL
# MAT MRK LUK JHN ACT ROM 1CO 2CO GAL EPH PHP COL 1TH 2TH 1TI 2TI TIT PHM HEB JAS 1PE 2PE
# 1JN 2JN 3JN JUD REV
#
# A book that is not listed gets [default].
# The books listed below are only examples; change them freely.

[default]
profile = "folk"
lead = "male"

[books]
RUT = { profile = "country", lead = "female" }
PSA = { profile = "hymn",    lead = "female" }
SNG = { profile = "jazz",    lead = "female" }
JON = { profile = "pop",     lead = "male" }
MRK = { profile = "hardrock", lead = "male" }

# Different choices for one edition (e.g. a Spanish edition with its own personas) go in
# editions.toml, under that edition.
