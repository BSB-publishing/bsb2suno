# Settings for one edition of the Bible text. The edition names are the ones in pins.json
# ("editions"), which says where each edition's text and alignment come from.
#
# Anything here applies to that edition only, and wins over the general files:
#   layout.toml  ->  languages.toml (the edition's language)  ->  editions.toml (the edition)
#
# An edition that is not listed here gets no text fixes and the general settings.


[BSB]

# Repairs to the text as the source delivers it, before it is read. Each one is narrow and is
# checked against the text the alignment was built on (see bsb2suno/edition.py):
#   "descriptive-titles"  a superscription given inside verse 1 ({"descriptive": true}) is read
#                         as a title, in the books listed in descriptive_title_books
#   "table-markers"       drop the "vvv" marker of the BSB translation tables (GEN 35:18)
#   "leaked-footnotes"    cut footnote text that was merged into the verse text, by exact match
#                         against the edition's own footnotes (pins.json footnotes_usj_dir)
fixes = ["descriptive-titles", "table-markers", "leaked-footnotes"]
# Only the Psalms: ZEC 12:1 is flagged the same way but is verse text in the BSB.
descriptive_title_books = ["PSA"]

# Added to the end of every style line, e.g. ", sung in Spanish".
style_suffix = ""

# The edition's own song choices (they win over books.toml):
#   [BSB.default]               default profile / lead
#   [BSB.books]                 per book, e.g.  RUT = { profile = "folk", lead = "female" }
#   [BSB.profiles.country]      part of a profile, e.g. that language's own personas:
#                               persona.female = "Country ES F"

# The edition's own layout (any setting of layout.toml), e.g.
#   [BSB.layout.stanzas]
#   edition_heading_weight = 3
